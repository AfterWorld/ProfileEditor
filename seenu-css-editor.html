<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SeenU Studio — Profile CSS/HTML Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg:#0a0a0d;
    --panel:#111115;
    --panel2:#17171c;
    --line:#26262e;
    --pink:#ff3fa4;
    --pink-dim:#7a2350;
    --text:#e9e9ee;
    --muted:#8b8b96;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --disp: 'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--disp);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- top bar ---------- */
  header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 18px;
    background:linear-gradient(180deg,#131318,#0d0d11);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    flex-wrap:wrap;
    --ctrl-h: 36px;
  }
  .brand{
    display:flex;
    align-items:center;
    height:var(--ctrl-h);
    gap:8px;
    margin-right:auto;
  }
  .brand .mark{
    display:inline-flex;
    align-items:center;
    height:22px;
    font-family:var(--mono);
    font-weight:700;
    color:var(--pink);
    font-size:12px;
    letter-spacing:.14em;
    border:1px solid var(--pink-dim);
    padding:0 7px;
    border-radius:4px;
    line-height:1;
  }
  .brand h1{
    font-size:16px;
    margin:0;
    font-weight:700;
    letter-spacing:.01em;
    line-height:1;
  }
  .brand span{
    color:var(--muted);
    font-size:12px;
    font-family:var(--mono);
    line-height:1;
    display:inline-flex;
    align-items:center;
  }

  select, button{
    box-sizing:border-box;
    height:var(--ctrl-h);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-family:var(--disp);
    font-size:13px;
    line-height:1;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel2);
    color:var(--text);
    padding:0 13px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  select{
    -webkit-appearance:none;
    appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 16px) center, calc(100% - 11px) center;
    background-size:5px 5px, 5px 5px;
    background-repeat:no-repeat;
    padding-right:30px;
  }
  select:hover, button:hover{ border-color:#3a3a44; background:#1c1c22; }
  button.primary{
    background:var(--pink);
    border-color:var(--pink);
    color:#1a0510;
    font-weight:700;
  }
  button.primary:hover{ background:#ff5cb1; }
  button.ghost{ background:transparent; }
  button:active{ transform:translateY(1px); }
  .divider{ width:1px; height:var(--ctrl-h); background:var(--line); margin:0 2px; flex-shrink:0; }
  .toolbar-group{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  /* ---------- layout ---------- */
  main.app{
    flex:1;
    display:grid;
    grid-template-columns: minmax(320px, 40%) 1fr;
    min-height:0;
  }
  @media (max-width: 860px){
    main.app{ grid-template-columns: 1fr; grid-template-rows: 45% 55%; }
  }

  /* ---------- editor pane ---------- */
  .editor-pane{
    display:flex;
    flex-direction:column;
    min-height:0;
    border-right:1px solid var(--line);
    background:var(--panel);
  }
  .tabs{
    display:flex;
    align-items:stretch;
    height:38px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    background:var(--panel);
  }
  .tab{
    display:inline-flex;
    align-items:center;
    font-family:var(--mono);
    font-size:12.5px;
    padding:0 16px;
    color:var(--muted);
    cursor:pointer;
    border-right:1px solid var(--line);
    user-select:none;
    letter-spacing:.03em;
    line-height:1;
  }
  .tab.active{ color:var(--pink); background:var(--panel2); }
  .tab-count{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:16px;
    height:16px;
    padding:0 4px;
    border-radius:4px;
    background:rgba(255,255,255,.06);
    color:var(--muted);
    font-size:10px;
    line-height:1;
    margin-left:7px;
  }
  .tab.active .tab-count{ background:rgba(255,63,164,.15); color:var(--pink); }
  .editor-wrap{ flex:1; min-height:0; position:relative; }
  textarea{
    width:100%;
    height:100%;
    resize:none;
    border:0;
    outline:0;
    background:#0d0d11;
    color:#d8d8e2;
    font-family:var(--mono);
    font-size:13px;
    line-height:1.55;
    padding:16px 18px;
    tab-size:2;
    display:none;
  }
  textarea.active{ display:block; }
  textarea::placeholder{ color:#4b4b56; }
  textarea::selection{ background:rgba(255,63,164,.28); }

  .editor-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    height:38px;
    padding:0 14px;
    border-top:1px solid var(--line);
    background:var(--panel2);
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
    flex-shrink:0;
    line-height:1;
  }
  .editor-footer > span{
    display:inline-flex;
    align-items:center;
    line-height:1;
  }
  .status-dot{
    display:inline-block;
    width:6px; height:6px;
    border-radius:50%;
    background:#3ddc84;
    margin-right:6px;
    box-shadow:0 0 6px #3ddc84;
    flex-shrink:0;
  }

  /* ---------- preview pane ---------- */
  .preview-pane{
    display:flex;
    flex-direction:column;
    min-height:0;
    background:#000;
  }
  .preview-bar{
    display:flex;
    align-items:center;
    height:38px;
    gap:10px;
    padding:0 14px;
    background:var(--panel2);
    border-bottom:1px solid var(--line);
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
    flex-shrink:0;
    line-height:1;
  }
  .preview-bar .eye{
    display:inline-flex;
    align-items:center;
    line-height:1;
  }
  .preview-bar .url{
    flex:1;
    display:flex;
    align-items:center;
    height:24px;
    background:#0d0d11;
    border:1px solid var(--line);
    border-radius:6px;
    padding:0 10px;
    color:#9a9aa6;
  }
  .preview-bar .state{
    display:inline-flex;
    align-items:center;
    line-height:1;
    white-space:nowrap;
  }
  iframe{
    flex:1;
    width:100%;
    border:0;
    background:#000;
  }

  /* scrollbars for the editor itself */
  textarea::-webkit-scrollbar{ width:10px; }
  textarea::-webkit-scrollbar-thumb{ background:#26262e; border-radius:6px; }
  textarea::-webkit-scrollbar-track{ background:transparent; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">SEENU</span>
    <h1>Studio</h1>
    <span>CSS / HTML profile editor</span>
  </div>

  <div class="toolbar-group">
    <select id="presetSelect">
      <option value="">Load a preset…</option>
      <option value="layout">Base Layout (centering / avatar sizing)</option>
      <option value="shadowMonarch">Shadow Monarch (HUD / RPG)</option>
      <option value="starwars">Red Alert (Star Wars crawl)</option>
      <option value="win95">Windows 95 Boot</option>
      <option value="winxp">Windows XP Boot</option>
    </select>
    <button id="loadPresetBtn">Load</button>
  </div>

  <div class="divider"></div>

  <div class="toolbar-group">
    <button id="clearBtn" class="ghost">Clear all</button>
    <button id="downloadCssBtn">⬇ CSS</button>
    <button id="downloadHtmlBtn">⬇ HTML</button>
    <button id="downloadBothBtn" class="primary">⬇ Both</button>
  </div>
</header>

<main class="app">
  <section class="editor-pane">
    <div class="tabs">
      <div class="tab active" data-tab="css">style.css <span class="tab-count" id="cssCount">0</span></div>
      <div class="tab" data-tab="html">extra.html <span class="tab-count" id="htmlCount">0</span></div>
    </div>
    <div class="editor-wrap">
      <textarea id="cssInput" class="active" spellcheck="false" placeholder="/* Your CSS goes here.
Target real SeenU classes like .seenu-card, .seenu-card-title,
.seenu-card-body, .seenu-name, .seenu-profile-root, article.bg-surface,
.text-brand, .bg-surface, img.rounded-full, code, button, a … */"></textarea>
      <textarea id="htmlInput" spellcheck="false" placeholder="<!-- Extra markup / boot-screen overlays / <script> blocks go here.
This gets injected at the top of the profile, same as SeenU's
custom-HTML field. -->"></textarea>
    </div>
    <div class="editor-footer">
      <span><span class="status-dot"></span>live preview</span>
      <span id="charInfo">0 chars</span>
    </div>
  </section>

  <section class="preview-pane">
    <div class="preview-bar">
      <span class="eye">👁</span>
      <div class="url">seenu.io/your_handle</div>
      <span class="state" id="renderState">rendered just now</span>
    </div>
    <iframe id="preview" title="SeenU profile preview"></iframe>
  </section>
</main>

<script>
/* ============================================================

   theme CSS written against .seenu-card, .seenu-name, article.bg-surface,

   ============================================================ */

/* top 5 */
.top5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
@media (max-width:700px){ .top5{grid-template-columns:repeat(5,minmax(52px,1fr));} }
.top5 a{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:#fff;font-size:11px;font-weight:700;line-height:1.2;}

/* music */

article.bg-surface .body{padding:10px 14px;font-size:14px;line-height:1.5;color:#ececec;}
article.bg-surface footer{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);}
article.bg-surface footer button{display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-left:1px solid var(--line);border-radius:0;color:var(--muted);font-weight:600;font-size:12px;padding:9px 4px;height:38px;}
article.bg-surface footer button:first-child{border-left:0;}
article.bg-surface footer button:hover{background:var(--surface2);}

.comment .bubble b{display:block;font-size:12.5px;margin-bottom:2px;line-height:1.2;}
`;

/* ============================================================
   PRESETS — raw source pulled from your saved SeenU themes.
   Each raw blob is split automatically into a CSS half (every

   left over, e.g. boot-screen overlays).
   ============================================================ */

<script>

  }
};

/* ============================================================
   APP LOGIC
   ============================================================ */
const cssInput = document.getElementById('cssInput');
const htmlInput = document.getElementById('htmlInput');
const iframe = document.getElementById('preview');
const cssCount = document.getElementById('cssCount');
const htmlCount = document.getElementById('htmlCount');
const charInfo = document.getElementById('charInfo');
const renderState = document.getElementById('renderState');

// tabs
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('textarea').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab+'Input').classList.add('active');
  });
});

function render(){
  const userCss = cssInput.value;
  const userHtml = htmlInput.value;
  const doc = `<!DOCTYPE html><html><head><meta charset="utf-8">
    <style>${BASE_CSS}</style>
    <style id="user-css">${userCss}</style>
  </head><body class="seenu-profile-root">
    ${userHtml}
    ${BASE_HTML}
  </body></html>`;
  iframe.srcdoc = doc;
  cssCount.textContent = userCss.length;
  htmlCount.textContent = userHtml.length;
  charInfo.textContent = (userCss.length + userHtml.length) + ' chars';
  renderState.textContent = 'rendered just now';
}

let debounceTimer;
function scheduleRender(){
  clearTimeout(debounceTimer);
  renderState.textContent = 'editing…';
  debounceTimer = setTimeout(render, 350);
}
cssInput.addEventListener('input', scheduleRender);
htmlInput.addEventListener('input', scheduleRender);

document.getElementById('loadPresetBtn').addEventListener('click', ()=>{
  const key = document.getElementById('presetSelect').value;
  if(!key || !PRESETS[key]) return;
  cssInput.value = PRESETS[key].css;
  htmlInput.value = PRESETS[key].html;
  render();
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  cssInput.value = '';
  htmlInput.value = '';
  document.getElementById('presetSelect').value = '';
  render();
});

function download(filename, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
document.getElementById('downloadCssBtn').addEventListener('click', ()=>{
  download('seenu-profile.css', cssInput.value, 'text/css');
});
document.getElementById('downloadHtmlBtn').addEventListener('click', ()=>{
  download('seenu-profile-extra.html', htmlInput.value, 'text/html');
});
document.getElementById('downloadBothBtn').addEventListener('click', ()=>{
  download('seenu-profile.css', cssInput.value, 'text/css');
  setTimeout(()=>download('seenu-profile-extra.html', htmlInput.value, 'text/html'), 150);
});

render();
</script>
